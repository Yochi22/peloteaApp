# Infra local de Pelotea. En producción se replica con Dokploy/Coolify.
#   pnpm infra:up   /   pnpm infra:down
name: pelotea

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pelotea
      POSTGRES_PASSWORD: pelotea
      POSTGRES_DB: pelotea
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelotea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pelotea
      MINIO_ROOT_PASSWORD: pelotea-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket de comprobantes al levantar.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 pelotea pelotea-secret; do sleep 1; done;
      mc mb --ignore-existing local/pelotea-comprobantes;
      mc anonymous set none local/pelotea-comprobantes;
      exit 0;
      "

volumes:
  pg_data:
  redis_data:
  minio_data:
