# Blueprint de Render para una demo gratuita de Pelotea.
#
# Cubre: web (Next.js) + worker (WhatsApp/Baileys + BullMQ) + Postgres
# administrado (free). El worker corre como `type: web` (no `type: worker`)
# a propósito — Render solo da Background Workers en planes pagos, pero un
# "Web Service" free SÍ alcanza si bindea un puerto (ver
# `apps/worker/src/lib/server.ts`): se duerme tras ~15 min sin tráfico
# (aceptable en una demo). Redis y el almacenamiento de comprobantes
# (S3/MinIO) NO tienen equivalente gratis nativo en Render — se conectan a
# servicios externos gratuitos (Upstash para Redis, Backblaze B2 para S3)
# cuyas credenciales se pegan a mano en el dashboard de Render (variables
# marcadas `sync: false`). Detalle completo en RENDER.md.
#
# Uso: en el dashboard de Render, "New +" → "Blueprint" → apuntar a este repo.

databases:
  - name: pelotea-db
    plan: free
    databaseName: pelotea
    user: pelotea

services:
  - type: web
    name: pelotea-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    # `NODE_ENV=development` SOLO en el install: con el `NODE_ENV=production`
    # del servicio (abajo), pnpm salta TODAS las devDependencies del
    # monorepo — incluye `typescript` de `apps/web`, que Next.js necesita
    # para resolver los alias `@/*` de tsconfig.json (sin eso el build tira
    # "Module not found" en cualquier import `@/lib/...`, aunque el archivo
    # exista). El resto de la cadena sigue heredando el NODE_ENV real del
    # servicio para que el build de Next quede optimizado para producción.
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @pelotea/web build
    # `preDeployCommand` no existe en el plan free de Render — por eso esto
    # va pegado al arranque. `db push` en vez de `migrate deploy` a
    # propósito: todavía no existe ninguna migración generada (necesita una
    # Postgres real para crearla con `prisma migrate dev`, que este proyecto
    # nunca tuvo hasta desplegar acá) — `migrate deploy` sin migraciones no
    # hace NADA, ni siquiera crea las tablas, que es justo lo que pasó en el
    # primer deploy (`the table public.notificacion does not exist`). `db
    # push` sincroniza el schema directo, sin necesitar historial de
    # migraciones — correcto mientras no haya datos reales que proteger.
    # Cuando eso cambie, hay que migrar a `migrate dev` + `migrate deploy`
    # de verdad (ver CLAUDE.md). Es segura de repetir en cada wake-up del
    # free tier: si el schema ya coincide, no hace nada.
    startCommand: pnpm --filter @pelotea/db exec prisma db push --skip-generate --accept-data-loss && pnpm --filter @pelotea/web start
    healthCheckPath: /api/health
    envVars:
      # Crítico: todo el cálculo de horarios/disponibilidad usa Date local
      # ingenuo (setHours/setMinutes de JS), asumiendo hora de Venezuela —
      # `Sede.timezone` se guarda pero nada la aplica todavía. Sin esto, un
      # servidor en UTC (como Render) corre 4h todo el horario configurado
      # (una cancha con horario hasta las 10pm VET aparecía cortada ~6pm).
      - key: TZ
        value: America/Caracas
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pelotea-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://pelotea-web.onrender.com # ajustar al nombre real que Render asigne
      - key: DEFAULT_SEDE_SLUG
        value: club-piloto
      # Redis externo (Upstash free tier) — pegar a mano en el dashboard.
      # Usar la URL `rediss://` (TLS) que da Upstash, no `redis://`.
      - key: REDIS_URL
        sync: false
      # S3/MinIO externo (Backblaze B2 free tier) — pegar a mano.
      - key: S3_ENDPOINT
        sync: false
      # 'auto' sirve para Cloudflare R2; Backblaze B2 exige la región real
      # (la que aparece en el endpoint, ej. 'us-east-005') — pegar a mano.
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: S3_PUBLIC_ORIGIN
        sync: false

  # ── Worker: WhatsApp (Baileys) + BullMQ (hold-expiry, recordatorios, ofertas) ──
  - type: web
    name: pelotea-worker
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Mismo motivo que en pelotea-web: sin esto, pnpm salta @types/node (dev)
    # y `tsc` falla con TS2688 al no encontrar los tipos de Node.
    buildCommand: corepack enable && NODE_ENV=development pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @pelotea/worker build
    startCommand: pnpm --filter @pelotea/worker start
    healthCheckPath: /health
    envVars:
      # Mismo motivo que en pelotea-web: los jobs (hold-expiry, recordatorios)
      # también hacen Date math local ingenuo asumiendo hora de Venezuela.
      - key: TZ
        value: America/Caracas
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pelotea-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      # Sin disco persistente (pago) en el plan free: la sesión de WhatsApp
      # puede perderse si Render reconstruye el contenedor al despertar de
      # un sleep — en ese caso hay que volver a escanear el QR en /qr. Para
      # una demo puntual es aceptable; para algo que quede corriendo días,
      # conviene un disco persistente o subir a un plan pago.
      - key: WHATSAPP_SESSION_DIR
        value: /tmp/wa-session
      - key: WHATSAPP_ADMIN_NUMBER
        sync: false
      # Token para /qr?token=... — sin esto el endpoint del QR queda
      # deshabilitado (nunca expuesto sin protección, ver server.ts).
      - key: WHATSAPP_QR_TOKEN
        generateValue: true
      # Mismo bucket que pelotea-web — el worker solo BORRA comprobantes
      # viejos (ver jobs/limpieza-comprobantes.ts), nunca sube ni lee.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      # Días que se guarda un comprobante después de aprobarse/rechazarse
      # antes de borrarlo del bucket. Default 90 si no se define.
      - key: COMPROBANTE_RETENCION_DIAS
        value: '90'
