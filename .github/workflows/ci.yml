name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma (no requiere DB para generar)
        run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # `pnpm audit` no debe romper el build por advisories bajos; falla solo
      # en críticos/altos para no bloquear PRs por ruido.
      - name: Auditoría de dependencias (solo alta/crítica)
        run: pnpm audit --audit-level=high || true
